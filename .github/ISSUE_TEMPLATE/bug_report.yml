name: Bug report
description: Something doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: File type
      description: For example "HEIC photo from an iPhone" or "MKV video, 4K HDR".
  - type: input
    id: version
    attributes:
      label: KiwiConvert version and Windows version
      placeholder: KiwiConvert 0.1.0, Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Paste the end of %LOCALAPPDATA%\io.github.jherobred.kiwiconvert\logs\kiwiconvert.log. Remove anything personal first.
      render: text
