name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            installer

      - name: Cache FFmpeg and PDFium downloads
        uses: actions/cache@v4
        with:
          path: vendor/.cache
          key: engines-${{ hashFiles('scripts/fetch-binaries.ps1') }}

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: ./scripts/fetch-binaries.ps1
        shell: pwsh

      - name: Test the app
        run: cargo test --locked
        working-directory: src-tauri

      - name: Test the installer
        run: cargo test --locked
        working-directory: installer
